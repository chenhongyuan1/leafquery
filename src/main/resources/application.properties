spring.application.name=leafquery
spring.profiles.default=dev

# Python 病虫害预测服务地址 (优先读取环境变量 PYTHON_AI_URL)
python.service.url=${PYTHON_AI_URL:http://localhost:5000/predict}
python.service.connect-timeout-ms=${PYTHON_CONNECT_TIMEOUT_MS:3000}
python.service.read-timeout-ms=${PYTHON_READ_TIMEOUT_MS:30000}

# YOLO 检测目标元数据 JSON（类别映射 + 支持的用户类别，Java/Python 共享单一数据源）
detection.metadata.path=${DETECTION_METADATA_PATH:./config/detection_target_metadata.json}

# 文件上传大小限制
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB

# 豆包 AI 大模型配置
doubao.api.url=${DOUBAO_API_URL:https://ark.cn-beijing.volces.com/api/v3/responses}
doubao.api.key=${DOUBAO_API_KEY:}
doubao.api.model=${DOUBAO_API_MODEL:doubao-seed-2-0-lite-260215}

# 数据库账号及密钥由启动器加载 .env，或由系统环境变量注入。
# 数据库连接配置 (优先读取环境变量 DB_URL, DB_USERNAME, DB_PASSWORD)
spring.datasource.url=${DB_URL:jdbc:mysql://127.0.0.1:3306/leafquery?useUnicode=true&characterEncoding=utf-8&serverTimezone=GMT%2B8&useSSL=false}
spring.datasource.username=${DB_USERNAME:leafquery}
spring.datasource.password=${DB_PASSWORD:}

spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# 禁止启动时重建表；新库初始化和已有库迁移应单独执行。
spring.sql.init.mode=never
# spring.sql.init.schema-locations=classpath:schema.sql
# spring.sql.init.continue-on-error=true

# MyBatis 配置
# 告诉 MyBatis 去哪里找手写的 SQL 文件
mybatis.mapper-locations=classpath:mapper/*.xml
# 开启驼峰命名自动映射 (如数据库的 avatar_url 会自动映射到 Java 的 avatarUrl)
mybatis.configuration.map-underscore-to-camel-case=true

# 打印执行的 SQL 语句以方便调试
logging.level.com.example.leafquery.mapper=debug

# 豆包大模型语音识别 (SeedASR) 配置
# 使用流式输入模式 (bigmodel_nostream)，通过 WebSocket 协议调用
asr.app.id=${ASR_APP_ID:}
asr.access.token=${ASR_ACCESS_TOKEN:}
asr.resource.id=${ASR_RESOURCE_ID:volc.seedasr.sauc.duration}

# 豆包大模型语音合成 (Seed-TTS V3) 配置
# 复用 ASR 的 AppID / AccessToken，仅 ResourceId 不同
tts.app.id=${TTS_APP_ID:${asr.app.id}}
tts.access.token=${TTS_ACCESS_TOKEN:${asr.access.token}}
tts.resource.id=${TTS_RESOURCE_ID:seed-tts-2.0}
tts.speaker=${TTS_SPEAKER:zh_female_tianmeitaozi_uranus_bigtts}

# 和风天气 API 配置
# 参考: https://dev.qweather.com/docs/configuration/authentication/
qweather.api-host=${QWEATHER_API_HOST:}
qweather.project-id=${QWEATHER_PROJECT_ID:}
qweather.key-id=${QWEATHER_KEY_ID:}
qweather.private-key=${QWEATHER_PRIVATE_KEY:}

# Dify API Config
dify.api.url=${DIFY_API_URL:https://api.dify.ai/v1}
dify.api.key=${DIFY_API_KEY:}
# YOLO confidence threshold for fallback
yolo.confidence.threshold=0.6

# 本地上传路径配置 (支持通过启动参数 --app.upload.dir 覆盖为生产环境绝对路径)
app.upload.dir=${UPLOAD_DIR:./user-frontend/public/images/uploads}
