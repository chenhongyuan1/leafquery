spring.application.name=leafquery

# Python 病虫害预测服务地址 (优先读取环境变量 PYTHON_AI_URL)
python.service.url=${PYTHON_AI_URL:http://localhost:5000/predict}

# 文件上传大小限制
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB

# 豆包 AI 大模型配置
doubao.api.url=https://ark.cn-beijing.volces.com/api/v3/responses
doubao.api.key=3a6f0896-a76b-4d55-bbec-6ab3ed1c7d53
doubao.api.model=doubao-seed-2-0-lite-260215

# 数据库连接配置 (如果数据库不存在，将自动创建)
# 数据库连接配置 (优先读取环境变量 DB_URL, DB_USERNAME, DB_PASSWORD)
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/leafquery_db?useUnicode=true&characterEncoding=utf-8&serverTimezone=GMT%2B8&createDatabaseIfNotExist=true}
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:root}

spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# 自动执行 schema.sql 初始化数据库
spring.sql.init.mode=always
spring.sql.init.schema-locations=classpath:schema.sql
spring.sql.init.continue-on-error=true

# MyBatis 配置
# 告诉 MyBatis 去哪里找手写的 SQL 文件
mybatis.mapper-locations=classpath:mapper/*.xml
# 开启驼峰命名自动映射 (如数据库的 avatar_url 会自动映射到 Java 的 avatarUrl)
mybatis.configuration.map-underscore-to-camel-case=true

# 打印执行的 SQL 语句以方便调试
logging.level.com.example.leafquery.mapper=debug

# 豆包大模型语音识别 (SeedASR) 配置
# 使用流式输入模式 (bigmodel_nostream)，通过 WebSocket 协议调用
asr.app.id=9366438019
asr.access.token=VhpBZv_l2cc0vce7vf56xqe7puXtdm_1
asr.resource.id=volc.seedasr.sauc.duration

# 豆包大模型语音合成 (Seed-TTS V3) 配置
# 复用 ASR 的 AppID / AccessToken，仅 ResourceId 不同
tts.app.id=${asr.app.id}
tts.access.token=${asr.access.token}
tts.resource.id=seed-tts-2.0
tts.speaker=zh_female_tianmeitaozi_uranus_bigtts

