# Safe development defaults. Credentials remain in the ignored .env file.
spring.datasource.url=${DB_URL:jdbc:mysql://127.0.0.1:3306/leafquery?useUnicode=true&characterEncoding=utf-8&serverTimezone=GMT%2B8&useSSL=false&allowPublicKeyRetrieval=true}
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:}
app.upload.dir=${UPLOAD_DIR:./user-frontend/public/images/uploads}
spring.sql.init.mode=never
